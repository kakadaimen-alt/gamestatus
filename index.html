<script>
const url = "https://tryloser-com-default-rtdb.firebaseio.com/games.json";

async function loadGames() {
  const res = await fetch(url);
  const data = await res.json();

  const container = document.getElementById("games");
  container.innerHTML = "";

  if (!data) {
    container.innerHTML = "<p>No games running.</p>";
    return;
  }

  Object.entries(data).forEach(([id, game]) => {
    if (!game) return;

    const name = game.name || "Unknown Game";
    const status = game.status || "offline";
    const link = game.link || "#";

    const div = document.createElement("div");

    div.style.border = "1px solid #ccc";
    div.style.padding = "10px";
    div.style.margin = "10px";
    div.style.borderRadius = "8px";

    div.innerHTML = `
      <h3>${name}</h3>
      <p>${status === "running" ? "✅ Running" : "❌ Offline"}</p>
      <a href="${link}" target="_blank">Play Game</a>
    `;

    container.appendChild(div);
  });
}

setInterval(loadGames, 5000);
loadGames();
</script>
