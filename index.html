<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Game Status</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>

<style>
:root{
  --bg:#ffffff;
  --card:#f5f5f5;
  --card2:#eaeaea;
  --text:#0a0a0a;
  --muted:#777;
  --bdr:#ddd;
  --accent:#000;
  --green:#22c55e;
}

body.dark{
  --bg:#0a0a0a;
  --card:#111;
  --card2:#1a1a1a;
  --text:#f5f5f5;
  --muted:#888;
  --bdr:#222;
  --accent:#fff;
  --green:#4ade80;
}

*{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  transition:background .3s,color .3s;
}

/* header */
header{
  padding:2rem;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--bdr);
}

h1{
  font-family:'Orbitron';
  font-size:2.5rem;
}

/* button */
button{
  border:1px solid var(--bdr);
  background:none;
  padding:6px 14px;
  cursor:pointer;
}

/* stats */
#stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  padding:20px;
}

.st{
  background:var(--card);
  padding:20px;
  border-radius:10px;
  text-align:center;
}

.stv{font-size:1.5rem;}

/* games */
#games{
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
}

.game-card{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  border:1px solid var(--bdr);
  transition:.2s;
}

.game-card:hover{
  background:var(--card2);
  transform:translateY(-3px);
}

.gname{
  font-weight:700;
  margin-bottom:10px;
}

.playbtn{
  display:block;
  text-align:center;
  padding:10px;
  border:1px solid var(--bdr);
  margin-top:10px;
  text-decoration:none;
  color:var(--text);
}

.playbtn:hover{
  background:var(--accent);
  color:var(--bg);
}

/* footer */
footer{
  padding:20px;
  text-align:center;
  border-top:1px solid var(--bdr);
}
</style>
</head>

<body>

<header>
  <h1>Game Status</h1>
  <div>
    <button onclick="toggleTheme()">Toggle Theme</button>
    <button onclick="toggleSnd()" id="sndbtn">SFX ON</button>
  </div>
</header>

<div id="stats">
  <div class="st"><div>Total</div><div id="sv-total">—</div></div>
  <div class="st"><div>Online</div><div id="sv-online">—</div></div>
  <div class="st"><div>Offline</div><div id="sv-offline">—</div></div>
  <div class="st"><div>Players</div><div id="sv-players">—</div></div>
  <div class="st"><div>Top Game</div><div id="sv-peak">—</div></div>
</div>

<div id="games"></div>

<footer>Auto refresh 5s</footer>

<script>
/* THEME */
function toggleTheme(){
  document.body.classList.toggle('dark');
  localStorage.setItem('theme',
    document.body.classList.contains('dark')?'dark':'light'
  );
}

if(localStorage.getItem('theme')==='dark'){
  document.body.classList.add('dark');
}

/* SOUND */
let muted=false;
function toggleSnd(){
  muted=!muted;
  sndbtn.textContent=muted?'SFX OFF':'SFX ON';
}

/* COUNT UP */
function countUp(el,target){
  el.textContent=target.toLocaleString();
}

/* BUILD CARD */
function buildCard(game){
  return `
  <div class="game-card">
    <div class="gname">${game.name}</div>
    <div>${game.players} players</div>
    <a class="playbtn" href="${game.link}" target="_blank">Play</a>
  </div>`;
}

/* FETCH */
const DB='https://tryloser-com-default-rtdb.firebaseio.com/games.json';

async function load(){
  try{
    const data=await(await fetch(DB)).json();
    const entries=Object.values(data||{});

    let total=entries.length;
    let online=entries.filter(g=>g.status==='running').length;
    let offline=total-online;
    let players=entries.reduce((a,b)=>a+(b.players||0),0);

    let peak=entries.sort((a,b)=>(b.players||0)-(a.players||0))[0];

    countUp(sv-total,total);
    countUp(sv-online,online);
    countUp(sv-offline,offline);
    countUp(sv-players,players);
    sv-peak.textContent=peak?peak.name:'—';

    games.innerHTML=entries.map(buildCard).join('');

  }catch(e){
    games.innerHTML="Error loading";
  }
}

load();
setInterval(load,5000);
</script>

</body>
</html>
