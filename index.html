<h1>🎮 Live Game Status</h1>
<div id="games"></div>

<script>
const url = "https://tryloser-com-default-rtdb.firebaseio.com/games.json";

async function loadGames() {
  const res = await fetch(url);
  const data = await res.json();

  const container = document.getElementById("games");
  container.innerHTML = "";

  if (!data) {
    container.innerHTML = "<p>No games running.</p>";
    return;
  }

  Object.values(data).forEach(game => {
    const div = document.createElement("div");

    div.style.border = "1px solid #ccc";
    div.style.padding = "10px";
    div.style.margin = "10px";
    div.style.borderRadius = "8px";

    div.innerHTML = `
      <h3>${game.name}</h3>
      <p>${game.status === "running" ? "✅ Running" : "❌ Offline"}</p>
      <a href="${game.link}" target="_blank">Play Game</a>
    `;

    container.appendChild(div);
  });
}

// refresh every 5 seconds
setInterval(loadGames, 5000);
loadGames();
</script>
