<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daimen Hub</title>

<style>
:root{
  --bg:#050505;
  --card:#111;
  --text:#fff;
  --muted:#aaa;
}

.light{
  --bg:#f5f5f5;
  --card:#fff;
  --text:#000;
  --muted:#555;
}

body{
  margin:0;
  font-family:system-ui;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
  transition:0.4s;
}

/* SMOOTH BACKGROUND */
body::before{
  content:"";
  position:fixed;
  width:200%;
  height:200%;
  background:
    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.08), transparent),
    radial-gradient(circle at 70% 70%, rgba(255,255,255,0.05), transparent);
  animation:move 20s linear infinite;
  z-index:-1;
}

@keyframes move{
  0%{transform:translate(0,0)}
  100%{transform:translate(-25%,-25%)}
}

/* HEADER */
.header{
  text-align:center;
  padding:30px 20px;
  font-size:28px;
  font-weight:700;
  animation:fade 1s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(-10px)}
  to{opacity:1}
}

/* BUTTON */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #333;
  cursor:pointer;
}

/* GRID */
.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.stats{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.stat{
  flex:1;
  background:var(--card);
  padding:15px;
  border-radius:10px;
  text-align:center;
}

/* CARDS */
.games{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
  gap:15px;
}

.card{
  position:relative;
  background:var(--card);
  border-radius:12px;
  padding:15px;
  overflow:hidden;
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
}

/* BACKGROUND IMAGE */
.bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  filter:blur(20px) brightness(0.3);
  transform:scale(1.2);
}

.content{
  position:relative;
  z-index:1;
}

.online{color:#4ade80}
.offline{color:#f87171}

.info{
  font-size:12px;
  color:var(--muted);
}

a{
  display:inline-block;
  margin-top:8px;
  padding:6px 10px;
  border:1px solid #333;
  border-radius:6px;
  text-decoration:none;
  color:var(--text);
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleTheme()">Theme</div>

<div class="header">✨ Daimen's Hub of Games ✨</div>

<div class="container">

<div class="stats">
  <div class="stat"><b id="total">0</b><br>Total</div>
  <div class="stat"><b id="online">0</b><br>Online</div>
  <div class="stat"><b id="players">0</b><br>Players</div>
</div>

<div class="games" id="games"></div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  databaseURL: "https://tryloser-com-default-rtdb.firebaseio.com/"
});

const db = getDatabase(app);
const gamesRef = ref(db, "games");

let seen = new Set();

/* SOUND FIX */
let audioCtx;
document.addEventListener("click", () => {
  audioCtx = new AudioContext();
});

function playSound(){
  if(!audioCtx) return;

  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();

  o.connect(g);
  g.connect(audioCtx.destination);

  o.frequency.value = 800;
  g.gain.value = 0.1;

  o.start();
  o.stop(audioCtx.currentTime + 0.1);
}

/* REALTIME */
onValue(gamesRef, snap => {
  const data = snap.val();
  const container = document.getElementById("games");
  container.innerHTML = "";

  let total=0, online=0, players=0;

  Object.entries(data || {}).forEach(([id,g])=>{
    total++;

    const isOnline = (Date.now()/1000 - g.lastUpdate) < 2;
    if(isOnline) online++;

    players += g.players || 0;

    if(!seen.has(id)){
      seen.add(id);
      playSound();
    }

    const img = `https://thumbnails.roblox.com/v1/games/icons?universeIds=${id}&size=512x512&format=Png`;

    const playerText = (g.players || 0) === 0 
      ? "Players: 0 :( " 
      : "Players: " + g.players;

    const div = document.createElement("div");
    div.className="card";

    div.innerHTML = `
      <div class="bg" style="background-image:url(${img})"></div>
      <div class="content">
        <div><b>${g.name}</b></div>

        <div class="${isOnline?'online':'offline'}">
          ${isOnline?"● Running":"● Offline"}
        </div>

        <div class="info">${playerText}</div>

        <a href="${g.link}" target="_blank">Play</a>
      </div>
    `;

    container.appendChild(div);
  });

  document.getElementById("total").textContent = total;
  document.getElementById("online").textContent = online;
  document.getElementById("players").textContent = players;
});

/* THEME SWITCH */
function toggleTheme(){
  document.body.classList.toggle("light");
}
window.toggleTheme = toggleTheme;

</script>

</body>
</html>
