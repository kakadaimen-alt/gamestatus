<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Monitor</title>

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #050505;
  color: white;
  overflow-x: hidden;
}

/* animated gradient background */
body::before {
  content: "";
  position: fixed;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, #111 0%, transparent 40%),
              radial-gradient(circle at 70% 70%, #111 0%, transparent 40%);
  animation: moveBg 20s linear infinite;
  z-index: -1;
}

@keyframes moveBg {
  0% { transform: translate(0,0); }
  100% { transform: translate(-25%, -25%); }
}

.container {
  max-width: 1100px;
  margin: auto;
  padding: 40px 20px;
}

h1 {
  font-size: 28px;
  margin-bottom: 20px;
}

.stats {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

.stat {
  flex: 1;
  background: #0f0f0f;
  padding: 15px;
  border-radius: 12px;
  text-align: center;
  transition: 0.3s;
}

.stat:hover {
  background: #151515;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 15px;
}

.card {
  background: #0f0f0f;
  border: 1px solid #1f1f1f;
  padding: 18px;
  border-radius: 14px;
  transition: 0.25s;
  opacity: 0;
  transform: translateY(10px);
  animation: fadeIn 0.4s forwards;
}

@keyframes fadeIn {
  to { opacity: 1; transform: translateY(0); }
}

.card:hover {
  transform: translateY(-6px);
  border-color: #333;
}

.name {
  font-weight: 600;
  margin-bottom: 6px;
}

.status {
  font-size: 13px;
  margin-bottom: 8px;
}

.online { color: #4ade80; }
.offline { color: #f87171; }

.info {
  font-size: 12px;
  color: #aaa;
}

a {
  display: inline-block;
  margin-top: 10px;
  font-size: 13px;
  color: white;
  border: 1px solid #333;
  padding: 6px 12px;
  border-radius: 8px;
  text-decoration: none;
}

a:hover {
  background: #222;
}

.unlock {
  position: fixed;
  bottom: 20px;
  left: 20px;
  font-size: 12px;
  color: #aaa;
}
</style>
</head>

<body>

<div class="container">
  <h1>Live Game Monitor</h1>

  <div class="stats">
    <div class="stat"><b id="total">0</b><br>Total</div>
    <div class="stat"><b id="online">0</b><br>Online</div>
    <div class="stat"><b id="players">0</b><br>Players</div>
  </div>

  <div class="games" id="games"></div>
</div>

<div class="unlock">Click anywhere to enable sound 🔊</div>

<audio id="alertSound" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>
const URL = "https://tryloser-com-default-rtdb.firebaseio.com/games.json";

let knownGames = new Set();
let soundEnabled = false;

document.addEventListener("click", () => {
  soundEnabled = true;
});

function timeAgo(ts) {
  const s = Math.floor(Date.now()/1000 - ts);
  if (s < 60) return s+"s ago";
  if (s < 3600) return Math.floor(s/60)+"m ago";
  return Math.floor(s/3600)+"h ago";
}

async function load() {
  const res = await fetch(URL);
  const data = await res.json();

  const container = document.getElementById("games");
  container.innerHTML = "";

  if (!data) return;

  let total = 0, online = 0, players = 0;

  Object.entries(data).forEach(([id, g]) => {
    if (!g) return;

    total++;

    const isOnline = (Date.now()/1000 - g.lastUpdate) < 60;
    if (isOnline) online++;

    players += g.players || 0;

    // 🔊 NEW GAME DETECTION
    if (!knownGames.has(id)) {
      knownGames.add(id);
      if (soundEnabled) {
        document.getElementById("alertSound").play();
      }
    }

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="name">${g.name}</div>
      <div class="status ${isOnline ? 'online' : 'offline'}">
        ${isOnline ? "● Running" : "● Offline"}
      </div>

      <div class="info">Players: ${g.players || 0}</div>
      <div class="info">Updated: ${timeAgo(g.lastUpdate || 0)}</div>

      <a href="${g.link}" target="_blank">Play</a>
    `;

    container.appendChild(div);
  });

  document.getElementById("total").textContent = total;
  document.getElementById("online").textContent = online;
  document.getElementById("players").textContent = players;
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
