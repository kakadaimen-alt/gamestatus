<!DOCTYPE html>
<html>
<head>
  <title>Game Status</title>
</head>
<body>

<h1>🎮 Live Game Status</h1>
<div id="games">Loading...</div>

<script>
const url = "https://tryloser-com-default-rtdb.firebaseio.com/games.json";

async function loadGames() {
  try {
    const res = await fetch(url);
    const data = await res.json();

    const container = document.getElementById("games");
    container.innerHTML = "";

    if (!data) {
      container.innerHTML = "<p>No games found.</p>";
      return;
    }

    for (const id in data) {
      const game = data[id];
      if (!game) continue;

      const name = game.name || "Unknown Game";
      const status = game.status || "offline";
      const link = game.link || "#";

      const div = document.createElement("div");

      div.style.border = "1px solid #ccc";
      div.style.padding = "10px";
      div.style.margin = "10px";
      div.style.borderRadius = "8px";

      div.innerHTML = `
        <h3>${name}</h3>
        <p>${status === "running" ? "✅ Running" : "❌ Offline"}</p>
        <a href="${link}" target="_blank">Play Game</a>
      `;

      container.appendChild(div);
    }
  } catch (err) {
    document.getElementById("games").innerText = "Error loading data";
    console.error(err);
  }
}

loadGames();
setInterval(loadGames, 5000);
</script>

</body>
</html>
