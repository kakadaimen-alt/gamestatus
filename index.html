<!DOCTYPE html>
<html>
<head>
  <title>Game Status</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0a0a0a;
      color: #fff;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 40px 20px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .stats {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
    }

    .stat {
      flex: 1;
      background: #111;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .stat span {
      display: block;
      font-size: 12px;
      color: #888;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: #111;
      border-radius: 12px;
      padding: 18px;
      transition: 0.3s;
      border: 1px solid #222;
    }

    .card:hover {
      transform: translateY(-5px);
      border-color: #444;
    }

    .name {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .status {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .online { color: #4ade80; }
    .offline { color: #f87171; }

    .info {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 10px;
    }

    a {
      text-decoration: none;
      font-size: 13px;
      color: #fff;
      border: 1px solid #333;
      padding: 6px 10px;
      border-radius: 6px;
      transition: 0.2s;
    }

    a:hover {
      background: #222;
    }

  </style>
</head>
<body>

<div class="container">
  <h1>Game Status</h1>

  <div class="stats">
    <div class="stat"><b id="total">0</b><span>Total</span></div>
    <div class="stat"><b id="online">0</b><span>Online</span></div>
    <div class="stat"><b id="players">0</b><span>Players</span></div>
  </div>

  <div class="games" id="games"></div>
</div>

<script>
const URL = "https://tryloser-com-default-rtdb.firebaseio.com/games.json";

function timeAgo(ts) {
  const sec = Math.floor(Date.now()/1000 - ts);
  if (sec < 60) return sec + "s ago";
  if (sec < 3600) return Math.floor(sec/60) + "m ago";
  return Math.floor(sec/3600) + "h ago";
}

async function load() {
  const res = await fetch(URL);
  const data = await res.json();

  const container = document.getElementById("games");
  container.innerHTML = "";

  if (!data) return;

  let total = 0, online = 0, players = 0;

  Object.entries(data).forEach(([id, g]) => {
    if (!g) return;

    total++;

    const isOnline = (Date.now()/1000 - g.lastUpdate) < 60;
    if (isOnline) online++;

    players += g.players || 0;

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="name">${g.name}</div>
      <div class="status ${isOnline ? 'online' : 'offline'}">
        ${isOnline ? "● Running" : "● Offline"}
      </div>

      <div class="info">Players: ${g.players || 0}</div>
      <div class="info">Updated: ${timeAgo(g.lastUpdate || 0)}</div>

      <a href="${g.link}" target="_blank">Play</a>
    `;

    container.appendChild(div);
  });

  document.getElementById("total").textContent = total;
  document.getElementById("online").textContent = online;
  document.getElementById("players").textContent = players;
}

load();
setInterval(load, 5000);
</script>

</body>
</html>
